name: Test staging branch
on:
  push:
    branches:
      - stage
jobs:
  Test-Staging-Branch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
      - run: ./gradlew test --no-daemon
