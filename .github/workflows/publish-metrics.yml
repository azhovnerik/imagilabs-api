name: Publish code metrics
on:
  push:
    branches:
      - master
jobs:
  Publish-Code-Metrics:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
      - run: ./gradlew test publishMetrics --no-daemon
