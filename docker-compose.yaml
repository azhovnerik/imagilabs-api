version: '3.2'

services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_DB: imagilabs # Database name
      POSTGRES_USER: imagilabs # Database username
      POSTGRES_PASSWORD: imagilabs # Database user password
    ports:
      - "5432:5432"
    volumes:
      - ./dev/imagilabs-db/pgdata:/var/lib/postgresql/data # Store Postgres data ./pgdata
